<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customers - CloudContactManager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../Shared/site-static.css" />
    <link rel="stylesheet" href="../Shared/sidebar-layout.css" />
</head>
<body class="bg-light">
    <div class="home-shell">
        <div class="row g-0">
            <aside class="col-lg-3 p-4 home-sidebar">
                <div class="home-brand mb-4"><i class="bi bi-cloud-check"></i> CloudContactManager</div>
                <ul class="home-menu d-grid gap-2">
                    <li><a href="../Home/Index.html"><i class="bi bi-house-door"></i> Home</a></li>
                    <li><a class="active" href="Index.html"><i class="bi bi-people"></i> Customers</a></li>
                    <li><a href="../Communication/Index.html"><i class="bi bi-send"></i> Send Messages</a></li>
                    <li><a href="../Home/Privacy.html"><i class="bi bi-shield-lock"></i> Privacy</a></li>
                </ul>
            </aside>

            <main class="col-lg-9 p-4 p-lg-5 home-main">
                <h1 class="page-title"><i class="bi bi-people-fill"></i> Quản lý Khách hàng</h1>

                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <div></div>
                    <div>
                        <a href="Create.html" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Thêm khách hàng mới</a>
                        <a href="../Communication/Index.html" class="btn btn-success"><i class="bi bi-send-fill"></i> Gửi tin nhắn hàng loạt</a>
                    </div>
                </div>
                <div id="messageBox" class="alert d-none" role="alert"></div>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Full Name</th>
                                    <th>Email Address</th>
                                    <th>Phone Number</th>
                                    <th>Address</th>
                                    <th>Created At</th>
                                    <th class="text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="customersBody"></tbody>
                        </table>
                    </div>
                </div>

                <div class="alert alert-info mt-3"><i class="bi bi-info-circle"></i> Tổng số: <strong id="customerCount">0</strong> khách hàng</div>
            </main>
        </div>
    </div>

    <footer class="text-center text-muted py-2" style="height:44px;">
        © 2026 - CloudContactManager - <a href="../Home/Privacy.html">Privacy</a>
    </footer>

    <script src="../Shared/api-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.CloudContactConfig.requireAuth('../Home/Login.html');
        window.CloudContactConfig.enableQuickLogout('../Home/Login.html');

        const API_BASE = window.CloudContactConfig?.apiBaseUrl || 'http://3.27.250.40';

        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.className = `alert alert-${type}`;
            box.textContent = text;
        }

        function formatDate(value) {
            if (!value) return '';
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? '' : date.toLocaleString('vi-VN');
        }

        function renderCustomers(customers) {
            const tbody = document.getElementById('customersBody');
            tbody.innerHTML = '';

            if (!Array.isArray(customers) || customers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Chưa có khách hàng nào.</td></tr>';
                document.getElementById('customerCount').textContent = '0';
                return;
            }

            customers.forEach(customer => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${customer.fullName ?? ''}</strong></td>
                    <td><i class="bi bi-envelope"></i> ${customer.emailAddress ?? ''}</td>
                    <td><i class="bi bi-telephone"></i> ${customer.phoneNumber ?? ''}</td>
                    <td>${customer.address ?? ''}</td>
                    <td>${formatDate(customer.createdAt)}</td>
                    <td class="text-center">
                        <div class="btn-group" role="group">
                            <a href="Edit.html?id=${customer.id}" class="btn btn-sm btn-warning" title="Chỉnh sửa"><i class="bi bi-pencil-square"></i></a>
                            <a href="Delete.html?id=${customer.id}" class="btn btn-sm btn-danger" title="Xóa"><i class="bi bi-trash"></i></a>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('customerCount').textContent = String(customers.length);
        }

        async function loadCustomers() {
            try {
                const response = await window.CloudContactConfig.authFetch(`${API_BASE}/api/Customers`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const customers = await response.json();
                renderCustomers(customers);
            } catch (error) {
                showMessage(`Không thể tải khách hàng từ API: ${error.message}`, 'danger');
            }
        }

        loadCustomers();
    </script>
</body>
</html>
