<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chỉnh sửa khách hàng - CloudContactManager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../Shared/site-static.css" />
    <link rel="stylesheet" href="../Shared/sidebar-layout.css" />
</head>
<body class="bg-light">
    <div class="home-shell">
        <div class="row g-0">
            <aside class="col-lg-3 p-4 home-sidebar">
                <div class="home-brand mb-4"><i class="bi bi-cloud-check"></i> CloudContactManager</div>
                <ul class="home-menu d-grid gap-2">
                    <li><a href="../Home/Index.html"><i class="bi bi-house-door"></i> Home</a></li>
                    <li><a class="active" href="Index.html"><i class="bi bi-people"></i> Customers</a></li>
                    <li><a href="../Communication/Index.html"><i class="bi bi-send"></i> Send Messages</a></li>
                    <li><a href="../Home/Privacy.html"><i class="bi bi-shield-lock"></i> Privacy</a></li>
                </ul>
            </aside>

            <main class="col-lg-9 p-4 p-lg-5 home-main">
                <h1 class="page-title"><i class="bi bi-pencil-square"></i> Chỉnh sửa khách hàng</h1>
                <div class="row">
                    <div class="col-12 col-xl-10 mx-auto">
                        <div class="card shadow-sm">
                            <div class="card-header bg-warning text-dark">
                                <h3 class="mb-0"><i class="bi bi-pencil-square"></i> Chỉnh sửa khách hàng</h3>
                            </div>
                            <div class="card-body">
                                <div id="messageBox" class="alert d-none" role="alert"></div>

                                <form id="editCustomerForm">
                                    <div class="form-group mb-3">
                                        <label class="form-label fw-bold">Full Name</label>
                                        <input id="fullName" class="form-control" placeholder="Nhập họ và tên" required />
                                    </div>

                                    <div class="form-group mb-3">
                                        <label class="form-label fw-bold">Email Address</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                            <input id="emailAddress" type="email" class="form-control" placeholder="email@example.com" required />
                                        </div>
                                    </div>

                                    <div class="form-group mb-3">
                                        <label class="form-label fw-bold">Phone Number</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                            <input id="phoneNumber" class="form-control" placeholder="+84xxxxxxxxx" required />
                                        </div>
                                        <small class="form-text text-muted">Định dạng: +84xxxxxxxxx (cho AWS SNS)</small>
                                    </div>

                                    <div class="form-group mb-3">
                                        <label class="form-label fw-bold">Address</label>
                                        <textarea id="address" class="form-control" rows="3" placeholder="Nhập địa chỉ (tùy chọn)"></textarea>
                                    </div>

                                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                        <a href="Index.html" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Quay lại</a>
                                        <button type="submit" class="btn btn-warning"><i class="bi bi-save"></i> Cập nhật</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <footer class="text-center text-muted py-2" style="height:44px;">
        © 2026 - CloudContactManager - <a href="../Home/Privacy.html">Privacy</a>
    </footer>

    <script src="../Shared/api-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.CloudContactConfig.requireAuth('../Home/Login.html');
        window.CloudContactConfig.enableQuickLogout('../Home/Login.html');

        const API_BASE = window.CloudContactConfig?.apiBaseUrl || 'http://3.27.250.40';
        const query = new URLSearchParams(window.location.search);
        const customerId = query.get('id');
        let createdAt = null;

        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.className = `alert alert-${type}`;
            box.textContent = text;
        }

        async function loadCustomer() {
            if (!customerId) {
                showMessage('Thiếu id khách hàng trên URL.', 'danger');
                document.getElementById('editCustomerForm').style.display = 'none';
                return;
            }

            try {
                const response = await window.CloudContactConfig.authFetch(`${API_BASE}/api/Customers/${customerId}`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const customer = await response.json();
                createdAt = customer.createdAt;
                document.getElementById('fullName').value = customer.fullName ?? '';
                document.getElementById('emailAddress').value = customer.emailAddress ?? '';
                document.getElementById('phoneNumber').value = customer.phoneNumber ?? '';
                document.getElementById('address').value = customer.address ?? '';
            } catch (error) {
                showMessage(`Không tải được thông tin khách hàng: ${error.message}`, 'danger');
                document.getElementById('editCustomerForm').style.display = 'none';
            }
        }

        document.getElementById('editCustomerForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const payload = {
                id: Number(customerId),
                fullName: document.getElementById('fullName').value.trim(),
                emailAddress: document.getElementById('emailAddress').value.trim(),
                phoneNumber: document.getElementById('phoneNumber').value.trim(),
                address: document.getElementById('address').value.trim(),
                createdAt
            };

            try {
                const response = await window.CloudContactConfig.authFetch(`${API_BASE}/api/Customers/${customerId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData?.message || `HTTP ${response.status}`);
                }

                window.location.href = 'Index.html';
            } catch (error) {
                showMessage(`Cập nhật thất bại: ${error.message}`, 'danger');
            }
        });

        loadCustomer();
    </script>
</body>
</html>
