<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xóa khách hàng - CloudContactManager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../Shared/site-static.css" />
    <link rel="stylesheet" href="../Shared/sidebar-layout.css" />
</head>
<body class="bg-light">
    <div class="home-shell">
        <div class="row g-0">
            <aside class="col-lg-3 p-4 home-sidebar">
                <div class="home-brand mb-4"><i class="bi bi-cloud-check"></i> CloudContactManager</div>
                <ul class="home-menu d-grid gap-2">
                    <li><a href="../Home/Index.html"><i class="bi bi-house-door"></i> Home</a></li>
                    <li><a class="active" href="Index.html"><i class="bi bi-people"></i> Customers</a></li>
                    <li><a href="../Communication/Index.html"><i class="bi bi-send"></i> Send Messages</a></li>
                    <li><a href="../Home/Privacy.html"><i class="bi bi-shield-lock"></i> Privacy</a></li>
                </ul>
            </aside>

            <main class="col-lg-9 p-4 p-lg-5 home-main">
                <h1 class="page-title"><i class="bi bi-trash"></i> Xóa khách hàng</h1>
                <div class="row">
                    <div class="col-12 col-xl-10 mx-auto">
                        <div class="card shadow-sm border-danger">
                            <div class="card-header bg-danger text-white">
                                <h3 class="mb-0"><i class="bi bi-exclamation-triangle-fill"></i> Xác nhận xóa khách hàng</h3>
                            </div>
                            <div class="card-body">
                                <div id="messageBox" class="alert d-none" role="alert"></div>
                                <div class="alert alert-warning"><i class="bi bi-info-circle"></i> Bạn có chắc chắn muốn xóa khách hàng này không? Hành động này không thể hoàn tác!</div>

                                <dl class="row">
                                    <dt class="col-sm-4">Full Name</dt>
                                    <dd class="col-sm-8"><strong id="fullName"></strong></dd>
                                    <dt class="col-sm-4">Email Address</dt>
                                    <dd class="col-sm-8"><i class="bi bi-envelope"></i> <span id="emailAddress"></span></dd>
                                    <dt class="col-sm-4">Phone Number</dt>
                                    <dd class="col-sm-8"><i class="bi bi-telephone"></i> <span id="phoneNumber"></span></dd>
                                    <dt class="col-sm-4">Address</dt>
                                    <dd class="col-sm-8" id="address"></dd>
                                    <dt class="col-sm-4">Created At</dt>
                                    <dd class="col-sm-8" id="createdAt"></dd>
                                </dl>

                                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                    <a href="Index.html" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Hủy bỏ</a>
                                    <button type="button" id="deleteButton" class="btn btn-danger"><i class="bi bi-trash"></i> Xác nhận xóa</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <footer class="text-center text-muted py-2" style="height:44px;">
        © 2026 - CloudContactManager - <a href="../Home/Privacy.html">Privacy</a>
    </footer>

    <script src="../Shared/api-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.CloudContactConfig.requireAuth('../Home/Login.html');
        window.CloudContactConfig.enableQuickLogout('../Home/Login.html');

        const API_BASE = window.CloudContactConfig?.apiBaseUrl || 'http://3.27.250.40';
        const query = new URLSearchParams(window.location.search);
        const customerId = query.get('id');

        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.className = `alert alert-${type}`;
            box.textContent = text;
        }

        function formatDate(value) {
            if (!value) return '';
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? '' : date.toLocaleString('vi-VN');
        }

        async function loadCustomer() {
            if (!customerId) {
                showMessage('Thiếu id khách hàng trên URL.', 'danger');
                document.getElementById('deleteButton').disabled = true;
                return;
            }

            try {
                const response = await window.CloudContactConfig.authFetch(`${API_BASE}/api/Customers/${customerId}`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const customer = await response.json();
                document.getElementById('fullName').textContent = customer.fullName ?? '';
                document.getElementById('emailAddress').textContent = customer.emailAddress ?? '';
                document.getElementById('phoneNumber').textContent = customer.phoneNumber ?? '';
                document.getElementById('address').textContent = customer.address ?? '';
                document.getElementById('createdAt').textContent = formatDate(customer.createdAt);
            } catch (error) {
                showMessage(`Không tải được thông tin khách hàng: ${error.message}`, 'danger');
                document.getElementById('deleteButton').disabled = true;
            }
        }

        document.getElementById('deleteButton').addEventListener('click', async function () {
            if (!customerId) {
                return;
            }

            try {
                const response = await window.CloudContactConfig.authFetch(`${API_BASE}/api/Customers/${customerId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData?.message || `HTTP ${response.status}`);
                }

                window.location.href = 'Index.html';
            } catch (error) {
                showMessage(`Xóa thất bại: ${error.message}`, 'danger');
            }
        });

        loadCustomer();
    </script>
</body>
</html>
